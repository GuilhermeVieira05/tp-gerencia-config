name: Pipeline

on:
  push:
    branches: [main]

jobs:
  # Etapa de Commit: build + testes unitarios + testes de integracao
  commit-stage:
    name: Etapa de Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Testes de unidade
        run: npm run test:unit
      - name: Testes de integracao
        run: npm run test:integration


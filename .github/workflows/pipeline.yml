name: Pipeline

on:
  push:
    branches: [main]
    # Tag semver dispara a etapa de Lancamento (ex.: v1.0.0)
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io

jobs:
  # Etapa de Commit: build + testes unitarios + testes de integracao
  commit-stage:
    name: Etapa de Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Testes de unidade
        run: npm run test:unit
      - name: Testes de integracao
        run: npm run test:integration

  # Etapa de Teste de Aceitacao: responsabilidade do Mateus
  # acceptance-stage:
  #   name: Etapa de Aceitacao
  #   needs: commit-stage
  #   runs-on: ubuntu-latest
  #   steps: []

  # Etapa de Lancamento (CD): responsabilidade do Bernardo
  # Roda apenas em push de tag vX.Y.Z. Publica a imagem no GHCR,
  # cria o GitHub Release e implanta no Render.
  # TODO: trocar `needs` para acceptance-stage quando o job do Mateus entrar.
  release-stage:
    name: Etapa de Lancamento
    needs: commit-stage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    permissions:
      contents: write   # criar o GitHub Release
      packages: write   # publicar no GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Validar tag contra package.json
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG difere da versao do package.json ($PKG). Atualize o package.json antes de criar a tag."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build da imagem (local, para smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:smoke
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test do conteiner
        run: |
          docker run -d --name smoke -p 3000:3000 app:smoke
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              docker rm -f smoke; exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Publicar imagem no GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotente: num re-run o Release ja existe e e mantido
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME ja existe (re-run); mantendo o existente."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Imagem: \`${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}\`"

      - name: Deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL nao configurado no environment production."
            exit 1
          fi
          # imgURL faz o Render implantar exatamente a versao recem-publicada
          curl -fsS -X POST -G "$RENDER_DEPLOY_HOOK_URL" --data-urlencode "imgURL=$IMAGE"

      - name: Verificar implantacao
        if: vars.RENDER_APP_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.RENDER_APP_URL }}/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::Aplicacao nao respondeu em ${{ vars.RENDER_APP_URL }}/health"
          exit 1

name: Pipeline

on:
  push:
    branches: [main]
    # Tag semver dispara a etapa de Lancamento (ex.: v1.0.0)
    tags: ['v*.*.*']
  # Valida o PR antes do merge (Commit e Aceitacao); o Lancamento so roda em tag
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Etapa de Commit: build + testes unitarios + testes de integracao
  commit-stage:
    name: Etapa de Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Testes de unidade
        run: npm run test:unit
      - name: Testes de integracao
        run: npm run test:integration

  # Etapa de Teste de Aceitacao (Mateus)
  # Constroi a mesma imagem Docker que vira release, sobe o conteiner e roda
  # os testes de aceitacao caixa-preta contra ele, so por HTTP.
  acceptance-stage:
    name: Etapa de Aceitacao
    needs: commit-stage
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    env:
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Artefato unico: esta e a UNICA construcao da imagem do pipeline.
      # A versao vem do package.json (a Etapa de Lancamento exige tag == package.json).
      - name: Build da imagem Docker (artefato candidato)
        id: build
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker build -t app:candidate \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg VCS_REF="${{ github.sha }}" .
          echo "image_id=$(docker image inspect app:candidate --format '{{.Id}}')" >> "$GITHUB_OUTPUT"

      - name: Subir conteiner
        run: docker run -d --name app -p 3000:3000 app:candidate

      - name: Aguardar aplicacao (health)
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "$BASE_URL/health"; then exit 0; fi
            sleep 2
          done
          echo "::error::Aplicacao nao respondeu em $BASE_URL/health"
          exit 1

      - name: Testes de aceitacao
        run: npm run test:acceptance

      - name: Salvar imagem aprovada (artefato para o Lancamento)
        run: docker save app:candidate | gzip > app-image.tar.gz

      - name: Publicar artefato da imagem
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: app-image.tar.gz
          retention-days: 7

      - name: Logs do conteiner (em caso de falha)
        if: failure()
        run: docker logs app

      - name: Parar conteiner
        if: always()
        run: docker rm -f app || true

  # Etapa de Lancamento (CD): responsabilidade do Bernardo
  # Roda apenas em push de tag vX.Y.Z. Publica a imagem no GHCR,
  # cria o GitHub Release e implanta no Render.
  # So roda depois que a Etapa de Aceitacao passar.
  release-stage:
    name: Etapa de Lancamento
    needs: acceptance-stage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    permissions:
      contents: write   # criar o GitHub Release
      packages: write   # publicar no GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Validar tag contra package.json
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG difere da versao do package.json ($PKG). Atualize o package.json antes de criar a tag."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Baixar a imagem aprovada na Aceitacao
        uses: actions/download-artifact@v4
        with:
          name: app-image

      - name: Carregar imagem e conferir que e a mesma testada
        env:
          EXPECTED_ID: ${{ needs.acceptance-stage.outputs.image_id }}
        run: |
          gunzip -c app-image.tar.gz | docker load
          ACTUAL="$(docker image inspect app:candidate --format '{{.Id}}')"
          echo "Imagem testada na Aceitacao: $EXPECTED_ID"
          echo "Imagem carregada no Lancamento: $ACTUAL"
          if [ "$EXPECTED_ID" != "$ACTUAL" ]; then
            echo "::error::A imagem do Lancamento difere da testada na Aceitacao."
            exit 1
          fi

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Smoke test do conteiner
        run: |
          docker run -d --name smoke -p 3000:3000 app:candidate
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              docker rm -f smoke; exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      # Sem rebuild: as tags apontam para a mesma imagem (mesmo ID) testada na Aceitacao.
      - name: Publicar a mesma imagem no GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker tag app:candidate "$t"
            docker push "$t"
          done

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotente: num re-run o Release ja existe e e mantido
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME ja existe (re-run); mantendo o existente."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Imagem: \`${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}\`"

      - name: Deploy no Render (scripts/deploy.sh)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: ./scripts/deploy.sh "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
